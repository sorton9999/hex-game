<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Hexel 2026</title>
    <!-- 1. Load React and ReactDOM (Development versions) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

    <!-- 2. Load Babel to transpile JSX in the browser -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { margin: 0; background: #050505; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; overflow: hidden; }
        .ui { position: absolute; top: 10px; width: 100%; pointer-events: none; z-index: 10; display: flex; justify-content: center; }
        .ui-inner { pointer-events: auto; background: rgba(0,0,0,0.9); padding: 15px; border: 2px solid #00ff00; border-radius: 12px; min-width: 300px; box-shadow: 0 0 20px #00ff0033; }
        .stat { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
        .high-scores { border-top: 1px solid #333; margin-top: 10px; padding-top: 10px; color: #ffcc00; font-size: 12px; }
        button { padding: 8px 16px; cursor: pointer; background: #00ff00; color: #000; border: none; border-radius: 4px; font-weight: bold; margin-top: 10px; width: 100%; }
        svg { display: block; margin: auto; height: 100vh; width: 100vw; }
        .victory { color: #fff; text-shadow: 0 0 10px #0f0; font-size: 1.2em; margin-bottom: 10px; }
        .wall-blocked { color: #ff0000; font-weight: bold; }
        /* Style for the Start and Goal text labels */
        .tile-label { font-size: 12px; fill: #b614df; font-weight: bold; pointer-events: none; text-anchor: middle; dominant-baseline: middle; }
        .glowing-wall-animation {
            animation: wall-pulse 2s infinite ease-in-out;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        @keyframes wall-pulse {
            0% { 
                stroke-width: 2; 
                opacity: 0.5; 
                filter: drop-shadow(0 0 2px #00f2ff);
            }
            50% { 
                stroke-width: 5; 
                opacity: 1; 
                filter: drop-shadow(0 0 8px #00f2ff);
            }
            100% { 
                stroke-width: 2; 
                opacity: 0.5; 
                filter: drop-shadow(0 0 2px #00f2ff);
            }
        }    
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        const HEX_SIZE = 35;
        const BASE_RADIUS = 4;

        // Helper to generate a unique key for a wall between two hexes
        const makeWallKey = (q1, r1, q2, r2) => [ `${q1},${r1}`, `${q2},${r2}` ].sort().join('|');

        // Define specific edges as walls (Pairing two adjacent hex coordinates)
        const WALLS_EASY = new Set([
            makeWallKey(0, 0, 1, 0),
            makeWallKey(1, -1, 1, -2),
            makeWallKey(1, -2, 2, -2),
            makeWallKey(-1, 1, 0, 1),
            makeWallKey(-2, 2, -1, 2)
        ]);
        const WALLS_HARD = new Set([
            makeWallKey(0, 0, 0, -1),
            makeWallKey(0, 0, 1, 0),
            makeWallKey(0, 0, -1, 0),
            makeWallKey(1, -1, 1, -2),
            makeWallKey(1, -2, 2, -2),
            makeWallKey(-1, 1, 0, 1),
            makeWallKey(-2, 2, -1, 2)
        ]);
        const WALLS_ELITE = new Set([
            makeWallKey(0, 0, 0, -1),
            makeWallKey(0, 0, 1, 0),
            makeWallKey(0, 0, -1, 0),
            makeWallKey(0, -2, 1, -2),
            makeWallKey(1, -1, 1, -2),
            makeWallKey(1, -2, 2, -2),
            makeWallKey(-1, 1, 0, 1),
            makeWallKey(-1, 1, -2, 1),
            makeWallKey(-2, 2, -1, 2),
            makeWallKey(3, -3, 3, -2),
            makeWallKey(0, -3, 0, -2),
            makeWallKey(-3, 0, -2, 0)
        ]);

        // Sound files for different events
        const SOUND_FILES = {
        collision: './sounds/mixkit-explainer-video-game-alert-sweep-236.wav',
        victory: './sounds/mixkit-winning-notification-2018.wav',
        blip: './sounds/mixkit-quick-lock-sound-2854.wav',
        start: './sounds/mixkit-arcade-rising-231.wav',
        reset: './sounds/mixkit-extra-bonus-in-a-video-game-2045.wav'
        };

        // Directions for neighboring tiles in axial coordinates (q, r)
        const NEIGHBOR_TILES = [[1,0], [0,1], [-1,1], [-1,0], [0,-1], [1,-1]];

        const PERMANENT_ROGUES = new Set();
        const TEMP_PROTECTED = new Set(); // tiles protected from becoming rogues while goal occupies them
        const rogueInterval = 0;

      
        // SoundManager Component: Handles loading and playing sounds based on game events
        const SoundManager = ({isCollision, isVictory, isBlip, isReset}) => {
            const audioContext = useRef(null);
            const audioBuffer = useRef(null);
            const sourceNode = useRef(null);
            const gainNode = useRef(null);
            const soundBuffers = useRef({}); // Cache for multiple sound files
            const [isPlaying, setIsPlaying] = useState(false);
            const [isUnlocked, setIsUnlocked] = useState(false);

            // Function to load a sound file and decode it into an AudioBuffer
            const loadSound = (soundFile) => {
                audioContext.current = new (window.AudioContext || window.webkitAudioContext)();
                gainNode.current = audioContext.current.createGain();
                gainNode.current.connect(audioContext.current.destination);
                gainNode.current.gain.value = 0.8;
                fetch(soundFile)                
                .then(response => response.arrayBuffer())
                .then(arrayBuffer => audioContext.current.decodeAudioData(arrayBuffer))
                .then(decodedBuffer => {
                    soundBuffers.current[soundFile] = decodedBuffer;
                    console.log("Audio loaded successfully");
                })
                .catch(err => console.error("Error loading audio", err));
            };

            // Function to play a sound by name, ensuring it doesn't overlap if already playing
            const playSound = (name) => {
                if (!soundBuffers.current[name] || isPlaying) return;
                sourceNode.current = audioContext.current.createBufferSource();
                sourceNode.current.buffer = soundBuffers.current[name];
                sourceNode.current.connect(gainNode.current);
                sourceNode.current.start(0);
                setIsPlaying(true);
                sourceNode.current.onended = () => setIsPlaying(false);
            };

            // Function to stop the currently playing sound
            const stopSound = () => {
                if (sourceNode.current) {
                    sourceNode.current.stop();
                    setIsPlaying(false);
                }
            };

            // Load all necessary sounds on component mount
            useEffect(() => {
                loadSound(SOUND_FILES.blip);
                loadSound(SOUND_FILES.collision);
                loadSound(SOUND_FILES.victory);
                loadSound(SOUND_FILES.reset);
            }, []);

            // Play specific sounds based on game events
            // Collision sound
            useEffect(() => {
                if (isCollision) playSound(SOUND_FILES.collision);
            }, [isCollision]);
            // Victory sound
            useEffect(() => {
                if (isVictory) playSound(SOUND_FILES.victory);
            }, [isVictory]);
            // Blip sound for UI interactions
            useEffect(() => {
                if (isBlip) playSound(SOUND_FILES.blip);
            }, [isBlip]);
            // Reset sound when the game is reset
            useEffect(() => {
                if (isReset) playSound(SOUND_FILES.reset);
            }, [isReset]);

            // Unlock audio on first user interaction
            // Many browsers require a user interaction to unlock audio playback, 
            // so we display a start button until the user clicks to enable sound
            if (!isUnlocked) {
                return (
                    <div 
                        onClick={() => {
                            if (audioContext.current) {
                                audioContext.current.resume().then(() => {
                                    setIsUnlocked(true);
                                    playSound(SOUND_FILES.start);
                                });
                            }
                        }} 
                        style={{ position: 'absolute', top: '50%', left: '50%', 
                        transform: 'translate(-50%, -50%)', padding: '20px 40px', 
                        backgroundColor: '#00ff00', color: '#000', borderRadius: '8px', 
                        cursor: 'pointer', zIndex: 20 }}>
                        CLICK TO START SIMULATION
                    </div>
                );
            }
            // This component does not render anything visible once audio is unlocked, 
            // it just manages sound effects in the background
            return null;
        };

        // HexTile Component: Represents each hexagonal tile on the grid, handling its rendering and behavior
        const HexTile = ({ q, r, isSelected, diff, isGoal, onFlashChange = () => {}, onSelect = () => {}, isPreview = false, startPos }) => {
            const [flashColor, setFlashColor] = useState("rgba(255,255,255,0.03)");
            const [isRogue, setRogue] = useState(false);
            const x = HEX_SIZE * (3/2 * q) + window.innerWidth / 2;
            const y = HEX_SIZE * (Math.sqrt(3) * (r + q/2)) + window.innerHeight / 2;
            const isStart = startPos && q === startPos.q && r === startPos.r;
            const wallsInUse = diff.label === "ELITE" ? WALLS_ELITE : diff.label === "HARD" ? WALLS_HARD : WALLS_EASY;

            // Handle flashing behavior for hazard tiles
            useEffect(() => {
                if (isGoal || isPreview || TEMP_PROTECTED.has(`${q},${r}`)) return;
                const trigger = () => {
                    setFlashColor(`hsla(${Math.random() * 360}, 90%, 50%, 0.8)`);
                    if (!TEMP_PROTECTED.has(`${q},${r}`)) onFlashChange(q, r, true);
                    // Use diff.duration for faster disappearance
                    setTimeout(() => { 
                      setFlashColor("rgba(255,255,255,0.03)"); 
                      if (!TEMP_PROTECTED.has(`${q},${r}`)) onFlashChange(q, r, false); 
                    }, diff.duration * 1000);
                };
                // Use diff.spawnRate for faster reappearance
                // Add a random-ness to the interval to make it less predictable
                const timer = setInterval(trigger, (4000 * diff.spawnRate) + Math.random() * 6000);
                return () => clearInterval(timer);
            }, [q, r, isGoal, isPreview, diff.spawnRate, diff.duration]);

            // Handle rogue tile behavior for ELITE difficulty, where certain tiles can become 
            // permanently hazardous
            useEffect(() => {
                if (isGoal || isSelected || isPreview || TEMP_PROTECTED.has(`${q},${r}`)) return;
                const rogue = () => Math.floor(Math.random() * 5) + 1 === 1 
                    && !PERMANENT_ROGUES.has(`${q},${r}`) && PERMANENT_ROGUES.size < 5
                    && !(startPos && startPos.q === q && startPos.r === r)
                    && rogueInterval % 10 === 0 && diff.label === "ELITE";
                if (rogue()) { setRogue(true); PERMANENT_ROGUES.add(`${q},${r}`); }
                setTimeout(() => { setRogue(false); rogueInterval += 1; }, 1000);
            }, [q, r, isGoal, isSelected, rogueInterval, isPreview, diff.label]);

            // Calculate the vertices of the hexagon based on its center (x, y)
            const points = Array.from({length: 6}, (_, i) => {
                const a = (Math.PI / 180) * (60 * i);
                return { x: x + HEX_SIZE * Math.cos(a), y: y + HEX_SIZE * Math.sin(a) };
            });
            // Determine fill color based on tile state: selected, goal, or flashing hazard
            let fill = isSelected ? "yellow" : flashColor;
            if (isGoal && !isSelected) fill = "#004411";
            // Draw Wall Lines: Only draw if the wall exists between this tile and a neighbor
            const wallElements = [];
            NEIGHBOR_TILES.forEach(([dq, dr], i) => {
                if (wallsInUse.has(makeWallKey(q, r, q + dq, r + dr))) {
                    // Each hex side corresponds to corners (i, i+1)
                    const p1 = points[i];
                    const p2 = points[(i + 1) % 6];
                    wallElements.push(
                        <line key={`wall-${i}`} x1={p1.x} y1={p1.y} x2={p2.x} y2={p2.y} 
                              stroke="#ff0000" strokeWidth="6" strokeLinecap="round" />
                    );
                }
            });
            // Convert points to a string format for the polygon SVG element
            const pointsStr = points.map(p => `${p.x},${p.y}`).join(" ");
            // Check if this tile is a permanent rogue tile, which should be rendered 
            // with a darker fill and a red glow
            const hasRogue = !isPreview && PERMANENT_ROGUES.has(`${q},${r}`);
            // Render the hexagon tile with appropriate fill and wall lines, and handle click events for selection
            // The render is a base polygon with a text label for start/goal, and an additional glowing polygon 
            // if it's the move tile or a goal
            return (
                <g>
                    <polygon 
                        points={pointsStr} 
                        fill={isSelected ? "yellow" : (isGoal ? "#004411" : hasRogue ? "#333" : flashColor)} 
                        stroke="#222" 
                        onClick={() => !isPreview && onSelect(q, r)} 
                    />
                    <text x={x} y={y} className="tile-label">
                        {isStart ? "START" : isGoal ? "GOAL" : ""}
                    </text>
                    {(isGoal || isSelected || hasRogue) && <polygon 
                        points={pointsStr} 
                        fill="none" 
                        stroke={isGoal ? "#00ff00" : hasRogue ? "red" : "lightblue"} 
                        strokeWidth="4" 
                        filter="url(#wall-glow-filter)" 
                        className="glowing-wall-animation"/>
                    }
                    {wallElements}
                </g>
            );
        };

        // App Component: Main component that manages game state, user interactions, and renders the UI and hex grid
        const App = () => {

            // Define difficulty levels with their respective spawn rates and hazard durations
            const DIFFICULTY_LEVELS = {
            EASY: { label: "EASY", spawnRate: 1, duration: 1.5 },
            HARD: { label: "HARD", spawnRate: 0.5, duration: 0.8 },
            ELITE: { label: "ELITE", spawnRate: 0.2, duration: 0.3 }
            };

            const EXTRA_ELITE_BLOCKERS = [
                { q: 1, r: -1 },
                { q: -1, r: 2 }
            ];

            const getDifficultyForLevel = (level) => {
                if (level === 1) return DIFFICULTY_LEVELS.EASY;
                if (level === 2) return DIFFICULTY_LEVELS.HARD;
                return DIFFICULTY_LEVELS.ELITE;
            };

            const addEliteBlockers = () => {
                EXTRA_ELITE_BLOCKERS.forEach(({ q, r }) => PERMANENT_ROGUES.add(`${q},${r}`));
            };

            const TRANSITION_VECTORS = [
                { x: 0, y: -110 },
                { x: 110, y: -55 },
                { x: 110, y: 55 },
                { x: 0, y: 110 },
                { x: -110, y: 55 },
                { x: -110, y: -55 }
            ];

            const getRandomFrom = (arr) => arr[Math.floor(Math.random() * arr.length)];

            

            // State variables for game logic, including difficulty, player position, hazards, 
            // timer, collisions, and high scores
            const [diff, setDiff] = useState(getDifficultyForLevel(1));            
            const [level, setLevel] = useState(1);
            const currentRadius = level >= 8 ? BASE_RADIUS + 2 : BASE_RADIUS;
            const START_POS = { q: 0, r: currentRadius };
            const GOAL_POS = { q: 0, r: -currentRadius };
            const getGoalTransitionSide = ({ q, r }) => {
                const R = currentRadius;
                if (q === 0 && r === -R) return getRandomFrom([5, 0]);
                if (q === R && r === -R) return getRandomFrom([0, 1]);
                if (q === R && r === 0) return getRandomFrom([1, 2]);
                if (q === 0 && r === R) return getRandomFrom([2, 3]);
                if (q === -R && r === R) return getRandomFrom([3, 4]);
                if (q === -R && r === 0) return getRandomFrom([4, 5]);
                if (r === -R) return 0;
                if (q === R) return 1;
                if (q + r === R) return 2;
                if (r === R) return 3;
                if (q === -R) return 4;
                if (q + r === -R) return 5;
                return 0;
            };
            const [selected, setSelected] = useState({ q: 0, r: currentRadius });
            const selectedRef = useRef({ q: 0, r: currentRadius });
            const [goal, setGoal] = useState(GOAL_POS);
            const goalRef = useRef(GOAL_POS);
            const [flashMap, setFlashMap] = useState({});
            const [timer, setTimer] = useState(0);
            const [collisions, setCollisions] = useState(0);
            const [isCollision, setIsCollision] = useState(false);
            const [isVictory, setIsVictory] = useState(false);
            const [isReset, setIsReset] = useState(false);
            const [isBlip, setIsBlip] = useState(false);
            const [status, setStatus] = useState("idle");
            // track player moves since level start; required to delay goal movement on level 3+
            const [playerMoves, setPlayerMoves] = useState(0);
            const [isTransitioning, setIsTransitioning] = useState(false);
            const [pendingLevel, setPendingLevel] = useState(null);
            const [pendingDiff, setPendingDiff] = useState(null);
            const [pendingBoardActive, setPendingBoardActive] = useState(false);
            const [pendingSide, setPendingSide] = useState(null);
            const [showContinuePrompt, setShowContinuePrompt] = useState(false);
            const [collisionJolt, setCollisionJolt] = useState({ x: 0, y: 0 });
            const collisionTimeouts = useRef([]);
            const [redFlash, setRedFlash] = useState(false);
            const statusRef = useRef("idle");
            const levelRef = useRef(1);
            const playerMovesRef = useRef(0);
            const perimeterTilesRef = useRef([]);
            const goalMovementIntervalRef = useRef(null);
            
            // High Score State (Fastest Time / Least Collisions)
            const [bestTime, setBestTime] = useState(() => localStorage.getItem('hex_best_time') || '--');
            const [bestCollisions, setBestCollisions] = useState(() => localStorage.getItem('hex_best_hits') || '--');

            // Function to clear high scores from localStorage and reset the displayed values
            const clearHighScores = () => {
                localStorage.removeItem('hex_best_time');
                localStorage.removeItem('hex_best_hits');
                setBestTime('--');
                setBestCollisions('--');
                setIsBlip(true);
                setTimeout(() => setIsBlip(false), 300);
             };

            const onReset = () => {
                const resetRadius = BASE_RADIUS;
                setSelected({ q: 0, r: resetRadius });
                selectedRef.current = { q: 0, r: resetRadius };
                setGoal({ q: 0, r: -resetRadius });
                setIsReset(true);
                setTimer(0);
                setCollisions(0);
                setStatus("idle");
                setLevel(1);
                setPlayerMoves(0);
                setIsTransitioning(false);
                setPendingLevel(null);
                setPendingDiff(null);
                setPendingBoardActive(false);
                setPendingSide(null);
                setShowContinuePrompt(false);
                setCollisionJolt({ x: 0, y: 0 });
                setDiff(getDifficultyForLevel(1));
                PERMANENT_ROGUES.clear();
                TEMP_PROTECTED.clear();
                goalRef.current = { q: 0, r: -resetRadius };
                statusRef.current = "idle";
                levelRef.current = 1;
                playerMovesRef.current = 0;
                rogueInterval = 0;
            };
 
            const startNextLevel = (nextLevel) => {
                const newRadius = nextLevel >= 8 ? BASE_RADIUS + 2 : BASE_RADIUS;
                setLevel(nextLevel);
                setDiff(getDifficultyForLevel(nextLevel));
                setSelected({ q: 0, r: newRadius });
                selectedRef.current = { q: 0, r: newRadius };
                setGoal({ q: 0, r: -newRadius });
                setPlayerMoves(0);
                setTimer(0);
                setCollisions(0);
                setStatus("playing");
                setIsVictory(false);
                setIsTransitioning(false);
                setPendingBoardActive(false);
                setPendingLevel(null);
                setPendingDiff(null);
                setPendingSide(null);
                setShowContinuePrompt(false);
                setCollisionJolt({ x: 0, y: 0 });
                PERMANENT_ROGUES.clear();
                TEMP_PROTECTED.clear();
                goalRef.current = { q: 0, r: -newRadius };
                statusRef.current = "playing";
                levelRef.current = nextLevel;
                playerMovesRef.current = 0;
                if (nextLevel >= 3) addEliteBlockers();
                rogueInterval = 0;
            };

            useEffect(() => {
                setDiff(getDifficultyForLevel(level));
            }, [level]);
 
             // Function to generate the list of perimeter tiles at the maximum radius, 
             // which are valid locations for the goal to move to
            const getPerimeterTiles = () => {
                const tiles = [];
                let q = 0, r = -currentRadius;
                for (let i = 0; i < 6; i++) {
                    for (let j = 0; j < currentRadius; j++) {
                        tiles.push({ q, r });
                        q += NEIGHBOR_TILES[i][0];
                        r += NEIGHBOR_TILES[i][1];
                    }
                }
                return tiles;
            };

            // Memoize the tiles so the reference stays the same across renders
            const perimeterTiles = useMemo(() => getPerimeterTiles(), [currentRadius]); 

// Keep a ref to the latest selected tile so the goal interval does not restart on every move
             useEffect(() => {
                 selectedRef.current = selected;
             }, [selected]);
 
             useEffect(() => {
                 goalRef.current = goal;
             }, [goal]);
 
             useEffect(() => {
                 statusRef.current = status;
             }, [status]);
 
             useEffect(() => {
                 levelRef.current = level;
             }, [level]);
 
             useEffect(() => {
                 playerMovesRef.current = playerMoves;
             }, [playerMoves]);
 
             useEffect(() => {
                 perimeterTilesRef.current = perimeterTiles;
             }, [perimeterTiles]);
 
             // Effect to move the goal periodically once the player has moved.
             // Timer does not start until the first player move, and it uses a
             // constant 3 second interval.
             useEffect(() => {
                 if (status !== "playing") return;
                 if (playerMoves < 1) return;
                 if (goalMovementIntervalRef.current) return;
 
                 const interval = setInterval(() => {
                     if (statusRef.current !== "playing") return;
                     if (levelRef.current < 3) return;
                     if (playerMovesRef.current < 3) return;
                     const tiles = perimeterTilesRef.current;
                     if (!tiles || tiles.length === 0) return;
 
                    // Try several random picks to find a valid perimeter tile this tick
                    let attempts = 12;
                    let chosen = null;
                    while (attempts-- > 0) {
                        const cand = tiles[Math.floor(Math.random() * tiles.length)];
                        if (!cand) continue;
                        if (cand.q === selectedRef.current.q && cand.r === selectedRef.current.r) continue;
                        if (cand.q === START_POS.q && cand.r === START_POS.r) continue;
                        if (cand.q === goalRef.current.q && cand.r === goalRef.current.r) continue;
                        if (PERMANENT_ROGUES.has(`${cand.q},${cand.r}`)) continue;
                        chosen = cand; break;
                    }
                    if (!chosen) return; // no valid tile found this tick
                    const key = `${chosen.q},${chosen.r}`;
                    TEMP_PROTECTED.clear();
                    TEMP_PROTECTED.add(key);
                    setFlashMap(p => {
                        if (!p[key]) return p;
                        const copy = { ...p };
                        delete copy[key];
                        return copy;
                    });
                    setGoal({ q: chosen.q, r: chosen.r });
                    console.log('Moved goal to:', { q: chosen.q, r: chosen.r });
                 }, 3000);
 
                 goalMovementIntervalRef.current = interval;
                 return () => {
                     if (goalMovementIntervalRef.current) {
                         clearInterval(goalMovementIntervalRef.current);
                         goalMovementIntervalRef.current = null;
                     }
                 };
             }, [playerMoves, status, level]);
            useEffect(() => {
                let interval;
                if (status === "playing") interval = setInterval(() => setTimer(t => t + 1), 1000);
                return () => clearInterval(interval);
            }, [status]);

            // Function to update high scores in localStorage if the current time or collisions are 
            // better than the stored values
            const updateHighScores = useCallback(() => {
                const currentBestTime = localStorage.getItem('hex_best_time');
                const currentBestHits = localStorage.getItem('hex_best_hits');
                console.log('Updating high scores:', { timer, collisions, currentBestTime, currentBestHits });
                if (!currentBestTime || timer < parseInt(currentBestTime)) {
                    console.log('New best time:', timer);
                    localStorage.setItem('hex_best_time', timer);
                    setBestTime(timer);
                }
                if (!currentBestHits || collisions < parseInt(currentBestHits)) {
                    localStorage.setItem('hex_best_hits', collisions);
                    setBestCollisions(collisions);
                }
            }, [timer, collisions]);

            // Effect to check for victory condition whenever the selected tile or game status changes, 
            // and update high scores if the player has won
            useEffect(() => {
                if (selected.q == goal.q && selected.r == goal.r && status === "won") {
                    setIsVictory(true);
                    updateHighScores();
                }
            }, [selected, status, updateHighScores]);

            useEffect(() => {
                if (status !== "won") return;
                if (level === 3) {
                    setShowContinuePrompt(true);
                    setIsTransitioning(false);
                    setPendingBoardActive(false);
                    return;
                }
                const nextLevel = level + 1;
                setPendingLevel(nextLevel);
                setPendingDiff(getDifficultyForLevel(nextLevel));
                setPendingSide(getGoalTransitionSide(goal));
                setPendingBoardActive(true);
                setIsTransitioning(true);
                const transitionTimer = setTimeout(() => startNextLevel(nextLevel), 900);
                return () => clearTimeout(transitionTimer);
            }, [status, level, goal]);

            // Cleanup any scheduled collision timeouts on unmount
            useEffect(() => {
                return () => {
                    collisionTimeouts.current.forEach(id => clearTimeout(id));
                    collisionTimeouts.current = [];
                };
            }, []);

            // Schedule multiple shakes and an optional red flash on collision
            const triggerCollisionEffects = () => {
                // clear previous scheduled timers
                collisionTimeouts.current.forEach(id => clearTimeout(id));
                collisionTimeouts.current = [];

                // number of shakes: level 5 -> 1, level6 ->2, ... capped at 4
                const shakes = level >= 5 ? Math.min(4, level - 4) : 0;
                if (shakes === 0) return;

                for (let i = 0; i < shakes; i++) {
                    const delay = i * 140;
                    const tSet = setTimeout(() => {
                        setCollisionJolt({ x: Math.random() * 18 - 9, y: Math.random() * 18 - 9 });
                    }, delay);
                    const tClear = setTimeout(() => setCollisionJolt({ x: 0, y: 0 }), delay + 100);
                    collisionTimeouts.current.push(tSet, tClear);
                }

                // level 8+ red flash overlay
                if (level >= 8) {
                    const tFlash = setTimeout(() => setRedFlash(true), 0);
                    const tFlashClear = setTimeout(() => setRedFlash(false), shakes * 140 + 180);
                    collisionTimeouts.current.push(tFlash, tFlashClear);
                }
            };

            // Function to handle player movement based on arrow key inputs, checking for collisions 
            // with walls and hazards,
            const move = useCallback((dq, dr) => {
                if (status === "won" || status === "stopped" || showContinuePrompt) { return; }
                if (status === "idle") { setStatus("playing"); }
                const nQ = selected.q + dq, nR = selected.r + dr;
                const coordKey = `${nQ},${nR}`;
                const inBounds = Math.abs(nQ) <= currentRadius && Math.abs(nR) <= currentRadius && Math.abs(-nQ-nR) <= currentRadius;
                const wallsInUse = diff.label === "ELITE" ? WALLS_ELITE : diff.label === "HARD" ? WALLS_HARD : WALLS_EASY;
                // 1. Check if the new position is within bounds before proceeding with collision checks
                if (!inBounds) return;
                // Handle reset state.
                // We don't want to return from here.  The reset is a new game state that we want to move into 
                // immediately on the next key press.
                if (isReset) {
                    setIsReset(false);
                }

                // 2. Check if moving through a wall
                if (wallsInUse.has(makeWallKey(selected.q, selected.r, nQ, nR)) ||
                    PERMANENT_ROGUES.has(coordKey)) {
                    setCollisions(h => h + 1);
                    setIsCollision(true);
                    triggerCollisionEffects();
                    return;
                }
                // If there was a collision but the player has now moved to a different tile, reset the collision state
                else if (isCollision) {
                    setIsCollision(false); return;
                }

                // 3. Check boundaries
                if (Math.max(Math.abs(nQ), Math.abs(nR), Math.abs(-nQ-nR)) > currentRadius) return;

                // 4. Check color hazards
                if (flashMap[`${nQ},${nR}`]) {
                    setCollisions(h => h + 1);
                    setIsCollision(true);
                    triggerCollisionEffects();
                    return;
                }
                else if (isCollision) {
                    setIsCollision(false); return;
                }

                // If all checks passed, update the selected position
                setSelected({ q: nQ, r: nR });
                setPlayerMoves(m => m + 1);
                if (nQ === goal.q && nR === goal.r) {
                    setIsVictory(true);
                    setStatus("won");
                    setTimeout(() => setIsVictory(false), 1000);
                }
            }, [selected, flashMap, status, showContinuePrompt, diff, isReset, isCollision, level]);

            // Keyboard event listener for arrow keys to move the player, and cleanup on component unmount
            useEffect(() => {
                const keys = { ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0] };
                const listener = (e) => keys[e.key] && move(...keys[e.key]);
                window.addEventListener('keydown', listener);
                return () => window.removeEventListener('keydown', listener);
            }, [move]);

            // Generate the list of hex tiles to render based on the defined radius limit, 
            // using axial coordinates (q, r)
            const tiles = useMemo(() => {
                const arr = [];
                for (let q = -currentRadius; q <= currentRadius; q++) {
                    for (let r = Math.max(-currentRadius, -q-currentRadius); r <= Math.min(currentRadius, -q+currentRadius); r++) arr.push({ q, r });
                }
                return arr;
            }, [currentRadius]);

            const renderBoard = ({ boardSelected, boardGoal, boardDiff, showHazards, style, boardKey }) => (
                <svg viewBox={`0 -30 ${window.innerWidth} ${window.innerHeight}`} style={style} key={boardKey}>
                    <defs>
                        <filter id="wall-glow-filter" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="3" result="blur" />
                            <feComposite in="SourceGraphic" in2="blur" operator="over" />
                        </filter>
                    </defs>
                    {tiles.map(t => (
                        <HexTile 
                            key={`${boardKey}-${t.q},${t.r}`} q={t.q} r={t.r} 
                            isGoal={t.q === boardGoal.q && t.r === boardGoal.r}
                            diff={boardDiff}
                            isSelected={boardSelected.q === t.q && boardSelected.r === t.r}
                            onFlashChange={showHazards ? (q, r, act) => setFlashMap(p => ({...p, [`${q},${r}`]: act})) : () => {}}
                            onSelect={showHazards ? (q, r) => status === "playing" && !flashMap[`${q},${r}`] && setSelected({q, r}) : () => {}}
                            isPreview={!showHazards}
                            startPos={START_POS}
                        />
                    ))}
                </svg>
            );

            // Render the UI, including the timer, collision count, high scores, difficulty selector, 
            // reset button, and the hex grid with tiles
            return (
                <div>
                    <div className="ui">
                        <div className="ui-inner">
                            {status === "won" && <div className="victory">SYSTEM SECURED!</div>}
                                    <div className="stat"><span>LEVEL:</span> <span>{level}</span></div>
                            <div className="stat"><span>TIME:</span> <span>{timer}s</span></div>
                            <div className="stat"><span>HITS:</span> <span>{collisions}</span></div>
                            <div className="high-scores">
                                <div className="stat"><span>FASTEST TIME:</span> <span>{bestTime}{bestTime !== '--' && 's'}</span></div>
                                <div className="stat"><span>FEWEST HITS:</span> <span>{bestCollisions}</span></div>
                            </div>
                            <div className="stat"><span>DIFFICULTY:</span> <span>{diff.label}</span></div>
                            <button onClick={() => { onReset() }}>RESET SIMULATION</button>
                            <button 
                                onClick={clearHighScores} 
                                style={{ marginTop: '5px', backgroundColor: '#330000', color: '#ff4444', border: '1px solid #ff4444' }}>
                                CLEAR HIGH SCORES
                            </button>
                        </div>
                    </div>
                    {showContinuePrompt && (
                        <div style={{ position: 'fixed', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', backgroundColor: 'rgba(0,0,0,0.92)', zIndex: 30, color: '#0f0', pointerEvents: 'auto' }}>
                            <div style={{ background: '#000', border: '2px solid #0f0', padding: '24px', width: '320px', textAlign: 'center', boxShadow: '0 0 20px rgba(0,255,0,0.5)' }}>
                                <div style={{ marginBottom: '14px', fontSize: '18px', fontWeight: 'bold' }}>LEVEL 3 COMPLETE</div>
                                <div style={{ marginBottom: '12px' }}>Fastest time: {bestTime !== '--' ? `${bestTime}s` : '--'}</div>
                                <div style={{ marginBottom: '12px' }}>Collisions: {bestCollisions !== '--' ? bestCollisions : '--'}</div>
                                <div style={{ marginBottom: '18px' }}>Continue at Elite difficulty?</div>
                                <div style={{ display: 'flex', gap: '10px', justifyContent: 'center' }}>
                                    <button style={{ padding: '10px 16px', background: '#0f0', color: '#000', border: 'none', cursor: 'pointer' }} onClick={() => startNextLevel(4)}>YES</button>
                                    <button style={{ padding: '10px 16px', background: '#330000', color: '#ff4444', border: '1px solid #ff4444', cursor: 'pointer' }} onClick={() => { setShowContinuePrompt(false); setStatus('stopped'); }}>NO</button>
                                </div>
                            </div>
                        </div>
                    )}
                    <div style={{ position: 'relative', width: '100vw', height: '100vh', overflow: 'hidden' }}>
                        {renderBoard({
                            boardSelected: selected,
                            boardGoal: goal,
                            boardDiff: diff,
                            showHazards: true,
                            boardKey: 'current',
                            style: (() => {
                                const side = pendingSide !== null ? pendingSide : 1;
                                const vec = TRANSITION_VECTORS[side];
                                const joltX = collisionJolt.x || 0;
                                const joltY = collisionJolt.y || 0;
                                return {
                                    position: 'absolute',
                                    top: 0,
                                    left: 0,
                                    width: '100%',
                                    height: '100%',
                                    transform: `${isTransitioning ? `translate(${-vec.x}vw, ${-vec.y}vh)` : 'translate(0, 0)'} translate(${joltX}px, ${joltY}px)`,
                                    transition: isTransitioning ? 'transform 0.8s ease' : 'none',
                                    overflow: 'visible'
                                };
                            })()
                        })}
                        {pendingBoardActive && renderBoard({
                            boardSelected: START_POS,
                            boardGoal: GOAL_POS,
                            boardDiff: pendingDiff || getDifficultyForLevel(level + 1),
                            showHazards: false,
                            boardKey: 'pending',
                            style: (() => {
                                const side = pendingSide !== null ? pendingSide : 1;
                                const vec = TRANSITION_VECTORS[side];
                                return {
                                    position: 'absolute',
                                    top: 0,
                                    left: 0,
                                    width: '100%',
                                    height: '100%',
                                    transform: isTransitioning ? 'translate(0, 0)' : `translate(${vec.x}vw, ${vec.y}vh)`,
                                    transition: 'transform 0.8s ease',
                                    visibility: isTransitioning ? 'visible' : 'hidden',
                                    overflow: 'visible'
                                };
                            })()
                        })}
                    </div>
                    {redFlash && <div style={{ position: 'absolute', inset: 0, backgroundColor: 'rgba(255,0,0,0.5)', zIndex: 25, pointerEvents: 'none' }} />}
                    <label style={{ position: 'absolute', bottom: '5px', width: '100%', textAlign: 'left', color: '#555', fontSize: '12px' }}>
                        Hexel 2026 (v.2.2.1) - Navigate to the GOAL using the arrow keys while avoiding hazards and walls!
                    </label>
                    <SoundManager isCollision={isCollision} isVictory={isVictory} isBlip={isBlip} isReset={isReset} />
                </div>
            );
        };

        // Render the App component into the root div
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
